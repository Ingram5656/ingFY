[package]
name = "ingfy"
version = "1.0.0"
description = "ingfy：液态玻璃动态歌词"
edition = "2021"

[lib]
name = "ingfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
open = "5"
cpal = "0.15"
rustfft = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

# 正式版：体积更小、运行更快（编译会慢一些）
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
